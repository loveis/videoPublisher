# 설정·VOD 파일·녹화를 각각 보관하는 볼륨. 파드가 다시 떠도 내용이 유지됩니다.
# storageClassName 은 클러스터 기본값을 쓰며, 지정이 필요하면 각 PVC 에 추가하세요.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediamtx-config
  namespace: mediamtx
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediamtx-media
  namespace: mediamtx
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediamtx-recordings
  namespace: mediamtx
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi

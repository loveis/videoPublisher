# 관리 화면 로그인 계정 — 배포 전에 반드시 바꾸세요.
# 바꾸는 방법: kubectl -n mediamtx create secret generic mediamtx-manager-admin \
#   --from-literal=ADMIN_USERNAME=admin --from-literal=ADMIN_PASSWORD='원하는비밀번호' \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: mediamtx-manager-admin
  namespace: mediamtx
type: Opaque
stringData:
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: change-me

# MediaMTX 설정 — video-publisher 가 이 파일로 MediaMTX 를 실행한다.
logLevel: info

api: yes
apiAddress: 127.0.0.1:9997

rtsp: yes
rtspAddress: :8554
rtspTransports: [udp, multicast, tcp]

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

rtmp: no
hls: no
srt: no

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api

paths:
  all_others:
